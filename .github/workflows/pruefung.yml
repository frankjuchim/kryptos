# Prüfung bei jedem Push (alle Branches) und jedem Pull Request nach main – TECHNIK §16.1.
# Hinweis: Die Live-App baut CapRover (ab M9) direkt bei jedem Push auf main – diese Prüfung blockiert das nicht.
# Deshalb auf Feature-Branches arbeiten und erst nach grüner Prüfung und ausdrücklicher Freigabe nach main übernehmen.
name: Prüfung

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: # von Hand (z. B. für den e2e-Durchlauf auf einem Feature-Branch)

jobs:
  app:
    name: App (Tests und Inhalts-Validator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - name: Abdeckung aus den Spec-Matrizen §11 (Lab, Akten, Boss, Fallen, Warm-up, Generatoren; TECHNIK §16.1)
        run: node scripts/abdeckung.js

  krypto:
    name: Krypto (Bibliothek und Python-Zwilling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Fachlisten (src/krypto/fach.js)
        run: node --test test/fach.test.js
      - name: Python-Zwilling, feste Vektoren
        run: python3 -I werkzeuge/krypto/test_krypto.py
      - name: Zwilling-Vergleich JS ↔ Python (2000 Fälle je Funktion)
        run: npm run krypto:vergleich -- --anzahl 2000
      - name: Prüfwerte der Materialien (Akten, Bosse, Klausuren, Videos) gegen den Zwilling
        run: python3 -I werkzeuge/krypto/pruefwerte.py
      - name: Fremde Verfahren W0–W6 (Spec-Vektoren)
        run: python3 -I werkzeuge/krypto/test_fremde_verfahren.py
      - name: Seeds unabhängig nachrechnen (Python-Zwilling, Delta §11; ohne Argumente alle sieben Welten + Gast)
        run: |
          python3 -I werkzeuge/krypto/seed_pruefen.py --pruefwerte test/fixtures/pruefwerte test/fixtures/welt_beispiel.json
          python3 -I werkzeuge/krypto/pruefwerte.py --ordner test/fixtures/pruefwerte
          python3 -I werkzeuge/krypto/seed_pruefen.py

  inhalte:
    name: Inhalte (Material-Pipeline, Online-IDE-Prüfstand)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Python-Pakete und Systempakete (LibreOffice, Carlito, Cairo)
        run: |
          pip install -r werkzeuge/material/requirements.txt python-pptx pypdf brotli
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libreoffice-writer libreoffice-impress fonts-crosextra-carlito fonts-dejavu-core
      - name: Material-Werkzeuge übersetzbar
        run: |
          python3 -m py_compile werkzeuge/material/*.py werkzeuge/*.py werkzeuge/ide-pruefung/ide_pruefen.py
          node --check werkzeuge/material/kr_pptx.js
      - name: Schriften (Glyphenabdeckung und Lizenzen, TECHNIK §11.4)
        run: python3 -I werkzeuge/schriften_pruefen.py
      - name: Kontraste der Material-Stile (WCAG AA, DESIGNSYSTEM §2.2) in gebauten docx/pptx
        run: |
          (cd werkzeuge/material && npm install --no-audit --no-fund)
          python3 -I werkzeuge/material/test_kontrast.py
      - name: Online-IDE-Prüfstand W0 und W3 (Gerüst kompiliert, LSG alle Tests grün, Testklassen identisch; Java 21)
        run: python3 -I werkzeuge/ide-pruefung/ide_pruefen.py
      - name: Workspace-Dateien für online-ide.de aktuell
        run: python3 -I werkzeuge/workspaces_erzeugen.py --pruefen
      - name: Akten-PDFs (Schülerfassungen, keine Lösungen, kein Funkraum-Regieteil)
        run: python3 -I werkzeuge/akten_pdf.py --pruefen
      - name: Lösungs-PDFs (Loesungen_Portal, Loesungen_Akten)
        run: python3 -I werkzeuge/loesungen_pdf.py --pruefen
      - name: Lehrkraft-PDFs und verzeichnis.json
        run: python3 -I werkzeuge/lehrkraft_pdf.py --pruefen
      - name: LibreOffice rendert Akten und eine Präsentation (Probe der PDF-Pipeline; W3·2 mit Pixelbild)
        run: |
          probe="$RUNNER_TEMP/pdf-probe"; mkdir -p "$probe"
          soffice -env:UserInstallation=file://$RUNNER_TEMP/lo-profil --headless --convert-to pdf --outdir "$probe" \
            materialien/Welt0_Antike/2_Akten/KR_W0_Akte1_Skytale_von_Sparta.docx \
            materialien/Welt0_Antike/1_Praesentation/KR_W0_Praesentation_Kickoff.pptx \
            materialien/Welt3_Maschinenzeitalter/2_Akten/KR_W3_Akte2_Blockchiffre_Baukasten.docx
          test -s "$probe/KR_W0_Akte1_Skytale_von_Sparta.pdf" && test -s "$probe/KR_W0_Praesentation_Kickoff.pdf"
          test -s "$probe/KR_W3_Akte2_Blockchiffre_Baukasten.pdf"
      - name: Material-Pipeline als Node-Test (test/material_pipeline.test.js, u. a. keine /home/-Pfade in Materialquellen)
        run: node --test test/material_pipeline.test.js
      # folgen (TECHNIK §16.1): materialien_pruefen.py und video_folien.py --pruefen (M9)

  e2e:
    name: e2e (Playwright, App + Dev-Portal)
    # nur von Hand und bei Pull Requests nach main (TECHNIK §16.1) – nicht bei jedem Push
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Chromium für Playwright
        run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore
